<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字開心 share</title>
  <!-- 引入 html-to-image 套件，用於將網頁 HTML 轉為圖片 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f2f2f7; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
    h1 { font-size: 20px; margin-bottom: 20px; color: #1c1c1e; }

    /* 卡片區域 */
    #card {
      width: 100%;
      max-width: 380px;
      height: 480px;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    /* 改用原生 <img> 標籤當作背景，解決 iOS 背景圖渲染失敗 */
    #card-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* 半透明文字底色面板 */
    .text-panel {
      position: relative;
      z-index: 2; /* 確保在背景圖上方 */
      width: 80%;
      background: rgba(43, 43, 43, 0.85);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .text-panel textarea {
      width: 100%;
      height: 150px;
      border: none;
      background: transparent;
      resize: none;
      font-size: 18px;
      line-height: 1.5;
      color: #d8d8db;
      outline: none;
    }

    /* 控制按鈕區 */
    .controls { width: 100%; max-width: 380px; margin-top: 24px; display: flex; flex-direction: column; gap: 12px; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      text-align: center;
    }
    .btn-upload { background-color: #007aff; }
    .btn-share { background-color: #34c759; }
    #imageInput { display: none; }
  </style>
</head>
<body>

  <h1>文字開心 share</h1>

  <div id="card">
    <!-- 新增底層 <img> 標籤處理圖片 -->
    <img id="card-bg" style="display: none;" />
    <div class="text-panel">
      <textarea placeholder="點擊此處輸入文字..."></textarea>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-upload" onclick="document.getElementById('imageInput').click()">選擇背景圖片</button>
    <input type="file" id="imageInput" accept="image/*" onchange="loadBackground(event)">
    <button class="btn btn-share" onclick="generateAndShare()">生成圖片並分享</button>
  </div>

  <script>
    // 1. 換背景圖邏輯：改成設定 <img> 標籤的 src
    function loadBackground(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgNode = document.getElementById('card-bg');
          imgNode.src = e.target.result;
          imgNode.style.display = 'block';
        }
        reader.readAsDataURL(file);
      }
    }

    // 2. 針對 iOS 調整的圖片導出邏輯
    async function generateAndShare() {
      const cardNode = document.getElementById('card');
      
      try {
        // 設定適用於 iOS WebKit 的轉換參數
        const options = {
          pixelRatio: 2,           // 2倍高清即可（降低 iOS 記憶體壓力）
          cacheBust: true,          // 清除快取，防止 iOS 抓空圖
          skipFonts: true,          // 避免 iOS 在載入系統字型時卡死圖片繪製
          style: {
            transform: 'scale(1)',  // 強制觸發重繪
          }
        };

        // **iOS 關鍵修正**：呼叫兩次 toPng，第一次用於強迫 WebKit 完成圖片解碼與渲染預熱
        await htmlToImage.toPng(cardNode, options);
        const dataUrl = await htmlToImage.toPng(cardNode, options);

        // 分享/下載圖片處理
        const res = await fetch(dataUrl);
        const blob = await res.blob();
        const file = new File([blob], 'card.png', { type: 'image/png' });

        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: '我的圖文卡片',
            files: [file]
          });
        } else {
          const link = document.createElement('a');
          link.download = 'card.png';
          link.href = dataUrl;
          link.click();
        }
      } catch (error) {
        alert('生成圖片失敗，請再試一次：' + error);
      }
    }
  </script>
</body>
</html>
